# 전략 S0 — 표준 세션 VWAP (수식 명세 v0.2 초기값)
strategy = "S0"
compare = 2        # 1: 기준선 이탈 청산 없음, 2: 포함

delta = 0.3        # S0 는 쓰지 않음
rho = 1.5          # 상대 거래량
eps = 0.2          # 기준선 이탈 허용 (ATR 배수)

# 위험관리 — 06장 Optuna 탐색 대상이 아니다
lam = 1.5          # 손절 (ATR 배수)
tau = 2.0          # 목표가 (ATR 배수)
h = 30             # 최대 보유 (봉)
cooldown = 10      # 재진입 대기 (봉)

[vwap]
N = 30
k = 5
theta = 0.05
m = 10
